[package]
name = "tobiid"
description = "The Tobii daemon: owns the device and serves head/gaze/presence to local clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
tobii-calib.workspace = true
tobii-ipc.workspace = true
tobii-log.workspace = true
tobii-proto.workspace = true
tobii-usb = { workspace = true }
tracing.workspace = true

[features]
# Head-pose inference from the IR image stream (ONNX Runtime, via tobii-usb's
# `head-pose`). On by default. Turn it off (`--no-default-features`) for a
# gaze-only daemon on targets where ONNX Runtime ships no prebuilt binary, such
# as x86_64 macOS.
default = ["head-pose"]
head-pose = ["tobii-usb/head-pose"]

[dev-dependencies]
tobii-calib = { workspace = true, features = ["testing"] }

[lints]
workspace = true
