[package]
name = "ttpbridge"
description = "Serves a Tobii Eye Tracker 5 to Tobii Pro Eye Tracker Manager on macOS and Windows, the way Tobii's own USB service would"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
# For the asynchronous EP 0x83 reader (libusb async transfers + timeval).
libc.workspace = true
rusb.workspace = true
libusb1-sys = "0.7"
# The TTP wire formats and the init replay: the same ones the daemon uses.
tobii-proto.workspace = true
# Gaze only: the bridge needs the init replay, not head pose (ONNX Runtime).
tobii-usb.workspace = true
tracing.workspace = true

[features]
# Build libusb from source, so the released macOS and Windows binaries need
# nothing installed. A feature, and off by default, because Cargo unifies
# features across the workspace: always on, it would also link a vendored
# libusb into the Linux daemon whenever the whole workspace is built.
vendored = ["rusb/vendored"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
