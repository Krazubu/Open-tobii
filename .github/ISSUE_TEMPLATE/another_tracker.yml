name: Another Tobii tracker
description: You have a tracker that is not the Eye Tracker 5
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Only the Eye Tracker 5 (USB `2104:0313`) is supported and verified.
        Another model is not a small change: the driver replays an
        initialisation captured from that one tracker, and a different
        generation answers a different stream catalogue, carries different
        properties and may speak a different protocol version. Nor can
        anything in this repository ask a tracker with another USB id: the
        daemon and the research tools look for `2104:0313` and open nothing
        else.

        What makes this tractable is three of its answers: the stream
        catalogue (command 1200), the identity strings (1420: serial, model,
        generation, firmware) and the property list (1330).
        `tools/abi/README.md` says what the Stream Engine decides from each.
        They should be in a USB capture taken while Tobii's own software
        starts the tracker; the Eye Tracker 5's came from one taken on Windows
        with USBPcap. The tracker can also be passed through to a Windows
        virtual machine and captured on the Linux host with usbmon.

  - type: input
    id: model
    attributes:
      label: Model and USB id
      description: "`lsusb` lists it; Tobii's vendor id is `2104`."
      placeholder: "Eye Tracker 5L, 2104:03xx"
    validations:
      required: true

  - type: textarea
    id: capture
    attributes:
      label: A capture of Tobii's software starting it
      description: |
        Say whether you have one or could take one, and which of Tobii's
        programs, at which version, started the tracker. Do not attach the
        capture: it holds the tracker's serial number (the first string of
        the 1420 answer, and the USB serial-number descriptor) and, if it ran
        on past the start, may hold the tracker's camera images of your face.
        If you have one, say so and keep it: the three answers can be cut out
        of it without the serial, and the maintainer will follow up here.

  - type: textarea
    id: willing
    attributes:
      label: Could you run a probe on it?
      description: |
        No probe can open another USB id yet. One written for yours would
        join `tobii5-init-replay`, which runs from a source build
        (INSTALL.md §2) and is in no package. Say whether you could build
        and run it — it is the difference between guessing and knowing.
