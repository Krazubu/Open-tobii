[package]
name = "ttpbridge"
version = "0.1.0"
# 2024, as tobii-linux's ported modules use (let chains in src/ttp).
edition = "2024"
description = "Makes a Tobii Eye Tracker 5 visible to Tobii Pro Eye Tracker Manager on macOS by serving it the way Tobii's USB service does"
license = "MIT"
repository = "https://github.com/Krazubu/tobii-et5-bridge"

[dependencies]
# libusb is built from source (vendored), so nothing needs installing.
rusb = { version = "=0.9.4", features = ["vendored"] }
libusb1-sys = "=0.7.0"
# Used by the ported TTP modules (src/ttp, from tobii-linux).
anyhow = "1"
tracing = "0.1"
# For the asynchronous EP 0x83 reader (libusb async transfers + timeval).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
debug = 1
