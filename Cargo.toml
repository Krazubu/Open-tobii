[package]
name = "ttpbridge"
version = "0.1.0"
edition = "2021"
description = "Makes a Tobii Eye Tracker 5 visible to Tobii Pro Eye Tracker Manager on macOS by serving it the way Tobii's USB service does"
license = "MIT"
repository = "https://github.com/Krazubu/tobii-et5-bridge"

[dependencies]
# libusb is built from source (vendored), so nothing needs installing.
rusb = { version = "=0.9.4", features = ["vendored"] }
libusb1-sys = "=0.7.0"

[profile.release]
debug = 1
